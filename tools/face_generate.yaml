identity:
  name: face_transform
  author: acedatacloud
  label:
    en_US: Face Transform
    zh_Hans: 面部转换
description:
  human:
    en_US: Analyze or transform faces with the Ace Data Cloud Face Transform API.
    zh_Hans: 通过 Ace Data Cloud 面部转换 API 分析或变换人脸。
  llm: Analyze or transform faces with the Ace Data Cloud Face Transform API. For
    asynchronous results, preserve task_id and use the task retrieval tool until completion.
    A successful submission is not completed output.
parameters:
- name: mode
  type: number
  required: false
  form: form
  label:
    en_US: Analyze Mode
    zh_Hans: 分析模式
  human_description:
    en_US: For keypoints only. 0 analyzes all faces; 1 analyzes the largest face.
    zh_Hans: 检测模式。`0` 表示检测图片中出现的所有人脸，`1` 表示仅检测面积最大的人脸。默认值为 `0`。
  llm_description: For keypoints only. 0 analyzes all faces; 1 analyzes the largest
    face.
- name: image_url
  type: string
  required: false
  form: form
  label:
    en_US: Image URL
    zh_Hans: 图片链接
  human_description:
    en_US: $t(face_detect_live_image_url)
    zh_Hans: $t(face_detect_live_image_url)
  llm_description: $t(face_detect_live_image_url)
- name: face_model_version
  type: number
  required: false
  form: form
  label:
    en_US: Face Model Version
    zh_Hans: 人脸模型版本
  human_description:
    en_US: $t(face_detect_live_face_model_version)
    zh_Hans: $t(face_detect_live_face_model_version)
  llm_description: $t(face_detect_live_face_model_version)
- name: need_rotate_detection
  type: number
  required: false
  form: form
  label:
    en_US: Rotate Detection
    zh_Hans: 旋转检测
  human_description:
    en_US: For keypoints only. 0 disables and 1 enables rotate detection.
    zh_Hans: 是否开启图片旋转识别。`0` 表示关闭，`1` 表示开启。默认值为 `0`。
  llm_description: For keypoints only. 0 disables and 1 enables rotate detection.
- name: smoothing
  type: number
  required: false
  form: form
  label:
    en_US: Smoothing
    zh_Hans: 磨皮
  human_description:
    en_US: $t(face_beautify_smoothing)
    zh_Hans: $t(face_beautify_smoothing)
  llm_description: $t(face_beautify_smoothing)
- name: whitening
  type: number
  required: false
  form: form
  label:
    en_US: Whitening
    zh_Hans: 美白
  human_description:
    en_US: $t(face_beautify_whitening)
    zh_Hans: $t(face_beautify_whitening)
  llm_description: $t(face_beautify_whitening)
- name: face_lifting
  type: number
  required: false
  form: form
  label:
    en_US: Face Lifting
    zh_Hans: 瘦脸
  human_description:
    en_US: $t(face_beautify_face_lifting)
    zh_Hans: $t(face_beautify_face_lifting)
  llm_description: $t(face_beautify_face_lifting)
- name: eye_enlarging
  type: number
  required: false
  form: form
  label:
    en_US: Eye Enlarging
    zh_Hans: 大眼
  human_description:
    en_US: $t(face_beautify_eye_enlarging)
    zh_Hans: $t(face_beautify_eye_enlarging)
  llm_description: $t(face_beautify_eye_enlarging)
- name: age_infos
  type: string
  required: false
  form: form
  label:
    en_US: Age Information
    zh_Hans: 年龄信息
  human_description:
    en_US: 'Required for age. JSON array such as [{"age": 30}]. Enter a JSON array.
      Enter a JSON array or object where applicable.'
    zh_Hans: 'age 操作必填。JSON 数组，例如 [{"age": 30}]。 请填写 JSON 数组。 数组或对象请使用 JSON 格式。'
  llm_description: 'Required for age. JSON array such as [{"age": 30}]. Enter a JSON
    array. Enter a JSON array or object where applicable.'
- name: gender_infos
  type: string
  required: false
  form: form
  label:
    en_US: Gender Information
    zh_Hans: 性别信息
  human_description:
    en_US: 'Required for gender. JSON array such as [{"gender": 1}]. Enter a JSON
      array. Enter a JSON array or object where applicable.'
    zh_Hans: 'gender 操作必填。JSON 数组，例如 [{"gender": 1}]。 请填写 JSON 数组。 数组或对象请使用 JSON 格式。'
  llm_description: 'Required for gender. JSON array such as [{"gender": 1}]. Enter
    a JSON array. Enter a JSON array or object where applicable.'
- name: timeout
  type: number
  required: false
  form: form
  label:
    en_US: Timeout
    zh_Hans: timeout
  human_description:
    en_US: $t(face_swap_timeout)
    zh_Hans: $t(face_swap_timeout)
  llm_description: $t(face_swap_timeout)
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: $t(face_swap_callback_url)
    zh_Hans: $t(face_swap_callback_url)
  llm_description: $t(face_swap_callback_url)
- name: source_image_url
  type: string
  required: false
  form: form
  label:
    en_US: Source Image URL
    zh_Hans: 源图片链接
  human_description:
    en_US: $t(face_swap_source_image_url)
    zh_Hans: $t(face_swap_source_image_url)
  llm_description: $t(face_swap_source_image_url)
- name: target_image_url
  type: string
  required: false
  form: form
  label:
    en_US: Target Image URL
    zh_Hans: 目标图片链接
  human_description:
    en_US: $t(face_swap_target_image_url)
    zh_Hans: $t(face_swap_target_image_url)
  llm_description: $t(face_swap_target_image_url)
- name: action
  type: select
  required: false
  form: form
  label:
    en_US: Action
    zh_Hans: 操作
  human_description:
    en_US: Which face operation to perform.
    zh_Hans: 要执行的面部操作。
  llm_description: Which face operation to perform.
  default: keypoints
  options:
  - value: keypoints
    label:
      en_US: keypoints
      zh_Hans: keypoints
  - value: beautify
    label:
      en_US: beautify
      zh_Hans: beautify
  - value: age
    label:
      en_US: age
      zh_Hans: age
  - value: gender
    label:
      en_US: gender
      zh_Hans: gender
  - value: swap
    label:
      en_US: swap
      zh_Hans: swap
  - value: cartoon
    label:
      en_US: cartoon
      zh_Hans: cartoon
  - value: liveness
    label:
      en_US: liveness
      zh_Hans: liveness
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/face_generate.py
